[project]
name = "insurance-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.100",
    "chainlit>=2.12.0",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.5",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.12",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # El cliente Qdrant en memoria (tests) ignora los payload indexes y avisa.
    "ignore:Payload indexes have no effect:UserWarning",
]
